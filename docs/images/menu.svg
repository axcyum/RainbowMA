<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img"><defs><linearGradient id="rainbow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff507b"/><stop offset=".2" stop-color="#ffce5b"/><stop offset=".4" stop-color="#8eee74"/><stop offset=".6" stop-color="#4ddbe8"/><stop offset=".8" stop-color="#7b88ff"/><stop offset="1" stop-color="#e171ef"/></linearGradient><linearGradient id="horizontal"><stop stop-color="#ff507b"/><stop offset=".2" stop-color="#ffce5b"/><stop offset=".4" stop-color="#8eee74"/><stop offset=".6" stop-color="#4ddbe8"/><stop offset=".8" stop-color="#7b88ff"/><stop offset="1" stop-color="#e171ef"/></linearGradient></defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#eef3ff}.muted{fill:#a8b5d0}.title{font-weight:700}</style><rect width="1100" height="410" rx="24" fill="#0c1220"/><text x="40" y="52" font-size="23" class="title" text-anchor="start">EXPRESSION MENU</text><rect x="35" y="82" width="426" height="38" rx="9" fill="#18243a"/><circle cx="56" cy="101" r="4" fill="#ffce5b"/><text x="74" y="107" font-size="17" class="" text-anchor="start">Render Queue</text><rect x="35" y="128" width="426" height="38" rx="9" fill="#18243a"/><circle cx="56" cy="147" r="4" fill="#e171ef"/><text x="74" y="153" font-size="17" class="" text-anchor="start">Gaming Rainbow Wire</text><rect x="35" y="174" width="426" height="38" rx="9" fill="#18243a"/><circle cx="56" cy="193" r="4" fill="#8eee74"/><text x="74" y="199" font-size="17" class="" text-anchor="start">Rainbow Lights</text><rect x="35" y="220" width="426" height="38" rx="9" fill="#18243a"/><circle cx="56" cy="239" r="4" fill="#4ddbe8"/><text x="74" y="245" font-size="17" class="" text-anchor="start">回転をON</text><rect x="35" y="266" width="426" height="38" rx="9" fill="#18243a"/><circle cx="56" cy="285" r="4" fill="#7b88ff"/><text x="74" y="291" font-size="17" class="" text-anchor="start">回転速度</text><rect x="35" y="312" width="426" height="38" rx="9" fill="#18243a"/><circle cx="56" cy="331" r="4" fill="#ff507b"/><text x="74" y="337" font-size="17" class="" text-anchor="start">コライダージャンプ</text><text x="505" y="113" font-size="27" class="title" text-anchor="start">回転速度</text><text x="505" y="145" font-size="17" class="muted" text-anchor="start">0〜4倍を、回転途中に変更</text><rect x="510" y="184" width="530" height="12" rx="6" fill="url(#horizontal)"/><circle cx="642.5" cy="190" r="13" fill="#fff" stroke="#7b88ff" stroke-width="4"/><text x="510" y="236" font-size="18" class="title" text-anchor="middle">0%</text><text x="510" y="266" font-size="17" class="muted" text-anchor="middle">停止</text><text x="642.5" y="236" font-size="18" class="title" text-anchor="middle">25%</text><text x="642.5" y="266" font-size="17" class="muted" text-anchor="middle">1倍</text><text x="775" y="236" font-size="18" class="title" text-anchor="middle">50%</text><text x="775" y="266" font-size="17" class="muted" text-anchor="middle">2倍</text><text x="1040" y="236" font-size="18" class="title" text-anchor="middle">100%</text><text x="1040" y="266" font-size="17" class="muted" text-anchor="middle">4倍</text><text x="505" y="325" font-size="19" class="title" text-anchor="start">既定：25% = 4秒で1周</text><text x="505" y="356" font-size="16" class="muted" text-anchor="start">回転OFFで、角度と移動モーションを戻す</text></svg>